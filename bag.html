<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Shopping Bag</title>
    <link rel="stylesheet" href="bag.css">
</head>
<body>

    <!-- Top Header Navigation -->
    <header class="checkout-header">
        <div class="header-container">
            <!-- Logo -->
            <div class="myntra-logo">
                <svg viewBox="0 0 512 512" width="40" height="40">
                    <path fill="#f16a85" d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256 256-114.6 256-256S397.4 0 256 0zm96.4 340.2c-5.7 8.3-15.3 13.8-26.2 13.8-13.6 0-25-8.7-29.1-20.9l-41.1-122.9-41.1 122.9c-4.1 12.2-15.5 20.9-29.1 20.9-10.9 0-20.5-5.5-26.2-13.8L112 272V171.3c0-15.1 12.2-27.3 27.3-27.3h16c15.1 0 27.3 12.2 27.3 27.3V232l36.4-100.2c4.1-11.2 14.8-18.5 26.8-18.5s22.7 7.3 26.8 18.5L309 232v-60.7c0-15.1 12.2-27.3 27.3-27.3h16c15.1 0 27.3 12.2 27.3 27.3V272l-47.2 68.2z"/>
                </svg>
            </div>

            <!-- Checkout Steps Indicator -->
            <ol class="checkout-steps">
                <li class="step active">BAG</li>
                <li class="step-divider"></li>
                <li class="step">ADDRESS</li>
                <li class="step-divider"></li>
                <li class="step">PAYMENT</li>
            </ol>

            <!-- Secure Badge -->
            <div class="secure-badge">
                <span class="secure-icon">🛡️</span>
                <span class="secure-text">100% SECURE</span>
            </div>
        </div>
    </header>

    <!-- Main Empty Bag Content Section -->
    <main class="empty-bag-container">
        <div class="content-box">
            
            <!-- Animated Shopping Bag Visual -->
            <div class="bag-graphic">
                <div class="wind-lines">
                    <span class="line line-1"></span>
                    <span class="line line-2"></span>
                </div>
                <div class="pink-bag">
                    <div class="bag-handle"></div>
                    <div class="bag-body">
                        <!-- M Logo inside bag -->
                        <span class="bag-logo">M</span>
                    </div>
                </div>
            </div>

            <!-- Heading & Description Text -->
            <h2 class="main-heading">Hey, it feels so light!</h2>
            <p class="sub-text">There is nothing in your bag. Let's add some items.</p>

            <!-- Action Button -->
            <a href="#" class="wishlist-btn">ADD ITEMS FROM WISHLIST</a>
            
        </div>
    </main>

</body>
</html>
