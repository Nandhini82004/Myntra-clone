<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Myntra</title>
    <link rel="stylesheet" href="Wish.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- HEADER - Exact Myntra Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/bc/Myntra_Logo.png" class="logo">
            <ul>
                <li>MEN</li>
                <li>WOMEN</li>
                <li>KIDS</li>
                <li>HOME</li>
                <li>BEAUTY</li>
                <li>GENZ</li>
                <li>STUDIO <sup>NEW</sup></li>
            </ul>
        </div>
        <div class="nav-right">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for products, brands and more">
            </div>
            <div class="icons">
                <div><i class="fa-regular fa-user"></i><span>Profile</span></div>
                <div><i class="fa-regular fa-heart"></i><span>Wishlist</span></div>
                <div><i class="fa-solid fa-bag-shopping"></i><span>Bag</span></div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT - Wishlist Login Page -->
    <div class="main-content">
        <h3 class="title">PLEASE LOG IN</h3>
        <p class="subtitle">Login to view items in your wishlist.</p>

        <div class="wishlist-img">
            <div class="box">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-bars"></i>
                <i class="fa-solid fa-xmark"></i>
                <i class="fa-solid fa-plus"></i>
            </div>
        </div>

     <a href=".//Profile.html" ><button class="login-btn">LOGIN</button></a>
    </div>
</body>
</html>
